services:
  # ===== Prometheus (coleta + armazena as métricas) =====
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'   # permite recarregar config sem reiniciar o container
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alertrules.yml:/etc/prometheus/alertrules.yml:ro
      - ./prometheus/security-alerts.yml:/etc/prometheus/security-alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring

  # ===== Grafana (dashboards e visualização) =====
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - "GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}"
      # Secret key FIXA (pra hash de senha ser estável entre reinicios)
      - GF_SECURITY_SECRET_KEY=chave_fixa_de_estudo_nao_usar_em_producao
      # Desativa a protecao de brute-force (pra estudo local; nao fazer em producao)
      - GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION=true
      # Desliga a telemetria/novidades do Grafana (menos ruído ao estudar)
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus

  # ===== Node Exporter (métricas do SISTEMA OPERACIONAL da maquina) =====
  # NOTA: no Docker Desktop/Windows, o mount ":/host" não funciona,
  # então este node-exporter monitora o PRÓPRIO container (conceito).
  # Para métricas reais do SO Windows, use o windows_exporter (Fase 2).
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - monitoring

  # ===== cAdvisor (métricas dos CONTAINERS Docker) =====
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    networks:
      - monitoring

  # ===== Alertmanager (roteamento de alertas) =====
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge